<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review & guest details · Solara Resort</title>
  <script src="script/preferences-init.js"></script>
  <link rel="stylesheet" href="CSS_Style/theme.css">
  <link rel="stylesheet" href="CSS_Style/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="booking">
  <div id="site-header"></div>

  <section class="section">
    <div class="container">
      <ol class="checkout-steps" aria-label="Booking progress">
        <li class="active"><span>1</span> Your selection</li>
        <li class="active"><span>2</span> Guest details</li>
        <li><span>3</span> Payment</li>
        <li><span>4</span> Confirmation</li>
      </ol>

      <div class="booking-layout">
        <div class="booking-main">
          <article class="info-card" id="bookingItem"></article>

          <form class="info-card booking-form" id="bookingForm" novalidate>
            <h2>Guest information</h2>
            <p class="hint">Enter the details of the lead guest for this stay.</p>
            <div class="form-row">
              <div>
                <label for="firstName">First name *</label>
                <input class="field" id="firstName" name="firstName" autocomplete="given-name" required>
                <p class="field-error" data-for="firstName"></p>
              </div>
              <div>
                <label for="lastName">Last name *</label>
                <input class="field" id="lastName" name="lastName" autocomplete="family-name" required>
                <p class="field-error" data-for="lastName"></p>
              </div>
            </div>
            <div class="form-row">
              <div>
                <label for="email">Email *</label>
                <input class="field" id="email" type="email" name="email" autocomplete="email" required>
                <p class="field-error" data-for="email"></p>
              </div>
              <div>
                <label for="phone">Phone *</label>
                <input class="field" id="phone" name="phone" inputmode="tel" autocomplete="tel" required>
                <p class="field-error" data-for="phone"></p>
              </div>
            </div>
            <div class="form-row">
              <div>
                <label for="country">Country / Region *</label>
                <select class="field" id="country" name="country" required>
                  <option value="">Select country</option>
                  <option>Cambodia</option>
                  <option>Thailand</option>
                  <option>Vietnam</option>
                  <option>Singapore</option>
                  <option>Malaysia</option>
                  <option>United States</option>
                  <option>United Kingdom</option>
                  <option>Australia</option>
                  <option>China</option>
                  <option>Japan</option>
                  <option>Other</option>
                </select>
                <p class="field-error" data-for="country"></p>
              </div>
              <div>
                <label for="promo">Promo code</label>
                <input class="field" id="promo" name="promo" placeholder="SOLARA10, STAY3, FAMILY">
              </div>
            </div>
            <label for="note">Special request</label>
            <textarea id="note" name="note" placeholder="Arrival time, extra bed, dietary needs (subject to availability)"></textarea>
          </form>
        </div>

        <aside class="summary-card sticky" id="bookingSummary"></aside>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="script/data.js"></script>
  <script src="script/store.js"></script>
  <script src="script/api.js"></script>
  <script src="script/preferences.js"></script>
  <script src="script/i18n.js"></script>
  <script src="script/app.js"></script>
  <script src="script/booking.js"></script>
</body>
</html>
