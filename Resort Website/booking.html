<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a stay · Solara Resort</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="booking">
  <div id="site-header"></div>
  <section class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=1800&q=80')">
    <h1>Reserve a room</h1>
  </section>
  <section class="section">
    <div class="container booking-layout">
      <form class="booking-form" id="bookingForm">
        <label>Room</label>
        <select class="field" id="roomId" name="roomId" required></select>
        <div class="form-row" style="margin-top:12px">
          <div>
            <label>Check-in</label>
            <input class="field" type="date" id="checkIn" name="checkIn" required>
          </div>
          <div>
            <label>Check-out</label>
            <input class="field" type="date" id="checkOut" name="checkOut" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Adults</label>
            <input class="field" type="number" id="adults" name="adults" min="1" max="8" value="1" required>
          </div>
          <div>
            <label>Children</label>
            <input class="field" type="number" id="children" name="children" min="0" max="4" value="0" required>
          </div>
        </div>
        <label>Promo code</label>
        <input class="field" id="promo" name="promo" placeholder="SOLARA10, STAY3, FAMILY">
        <label>Full name</label>
        <input class="field" name="guestName" required>
        <label>Email</label>
        <input class="field" type="email" name="email" required>
        <label>Phone</label>
        <input class="field" name="phone" required>
        <label>Note</label>
        <textarea name="note" placeholder="Arrival time, extra bed, allergies"></textarea>
        <button class="btn btn-primary" type="submit">Review booking</button>
      </form>
      <div id="reviewPanel" hidden class="booking-form"></div>
      <aside class="summary-card" id="bookingSummary"></aside>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="script/data.js"></script>
  <script src="script/store.js"></script>
  <script src="script/api.js"></script>
  <script src="script/app.js"></script>
  <script src="script/booking.js"></script>
</body>
</html>
