<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment · Solara Resort</title>
  <script src="script/preferences-init.js"></script>
  <script src="script/solara-config.js"></script>
  <link rel="stylesheet" href="CSS_Style/theme.css">
  <link rel="stylesheet" href="CSS_Style/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="payment">
  <div id="site-header"></div>

  <section class="section">
    <div class="container">
      <ol class="checkout-steps" aria-label="Booking progress">
        <li class="done"><span>1</span> Your selection</li>
        <li class="done"><span>2</span> Guest details</li>
        <li class="active"><span>3</span> Payment</li>
        <li><span>4</span> Confirmation</li>
      </ol>

      <div class="booking-layout" id="paymentLayout">
        <div class="booking-main">
          <article class="info-card">
            <h2>Payment method</h2>
            <p class="hint">KHQR uses Bakong (same flow as Payment_process). Card and other methods reserve your booking; pay at the resort or front desk.</p>
            <div class="payment-methods" id="paymentMethods"></div>
            <div class="payment-panel" id="paymentPanel"></div>
          </article>
        </div>
        <aside class="summary-card sticky" id="paymentSummary"></aside>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="script/data.js"></script>
  <script src="script/store.js"></script>
  <script src="script/api.js"></script>
  <script src="script/preferences.js"></script>
  <script src="script/i18n.js"></script>
  <script src="script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script src="script/payment.js"></script>
</body>
</html>
