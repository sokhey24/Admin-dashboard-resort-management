<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · Solara Resort</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="register">
  <div id="site-header"></div>
  <div class="auth-wrap">
    <form class="auth-card" id="registerForm">
      <h1>Create a guest account</h1>
      <p>No API yet. Your profile is stored in this browser for the guest journey only.</p>
      <p class="form-error" id="authError"></p>
      <label>Full name</label>
      <input class="field" name="name" required>
      <label>Email</label>
      <input class="field" type="email" name="email" required>
      <label>Phone</label>
      <input class="field" name="phone" required>
      <label>Password</label>
      <input class="field" type="password" name="password" minlength="6" required>
      <label>Confirm password</label>
      <input class="field" type="password" name="confirm" minlength="6" required>
      <button class="btn btn-primary" type="submit">Register</button>
      <p style="margin-top:14px">Already registered? <a href="login.html">Login</a></p>
    </form>
  </div>
  <div id="site-footer"></div>
  <script src="script/data.js"></script>
  <script src="script/store.js"></script>
  <script src="script/api.js"></script>
  <script src="script/app.js"></script>
  <script src="script/auth.js"></script>
</body>
</html>
