<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms · Solara Resort</title>
  <script src="script/preferences-init.js"></script>
  <link rel="stylesheet" href="CSS_Style/theme.css">
  <link rel="stylesheet" href="CSS_Style/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="rooms">
  <div id="site-header"></div>
  <section class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=1800&q=80')">
    <h1>Captivating rooms & villas</h1>
  </section>
  <section class="section">
    <div class="container">
      <p class="lead">Search the guest catalogue. Availability here only checks other bookings saved in this browser.</p>
      <div class="filter-grid">
        <input class="field" id="roomSearch" placeholder="Search name, type, or code">
        <input class="field" id="filterCheckIn" type="date" aria-label="Check-in">
        <input class="field" id="filterCheckOut" type="date" aria-label="Check-out">
        <select class="field" id="roomType">
          <option value="">All room types</option>
          <option>Villa</option>
          <option>Premium</option>
          <option>Deluxe</option>
        </select>
        <input class="field" id="minPrice" type="number" value="0" min="0" aria-label="Min price">
        <input class="field" id="maxPrice" type="number" value="300" min="0" aria-label="Max price">
        <select class="field" id="guestCount">
          <option value="0">Any capacity</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="8">8+</option>
        </select>
        <select class="field" id="filterAdults">
          <option value="0">Any adults</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="4">4+</option>
        </select>
        <select class="field" id="filterChildren">
          <option value="0">Any children</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
        </select>
        <select class="field" id="amenityFilter"></select>
        <select class="field" id="sortRooms">
          <option value="featured">Sort: featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating">Rating</option>
        </select>
        <label class="check-line"><input type="checkbox" id="featuredOnly"> Featured only</label>
        <button class="btn btn-outline" id="clearFilter" type="button">Clear filters</button>
        <button class="btn btn-primary" id="searchRoomBtn" type="button">Search</button>
      </div>
      <input id="priceRange" type="range" min="100" max="300" value="300" style="width:100%" aria-label="Maximum price">
      <div class="price-ticks"><span>$100</span><span>$150</span><span>$200</span><span>$300</span></div>
      <div class="room-gallery" id="roomGallery"></div>
      <p class="no-result" id="noResult">No rooms found for these filters.</p>
      <p style="text-align:center;margin-top:20px"><button class="btn btn-outline" id="loadMore" type="button">Load more</button></p>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="script/data.js"></script>
  <script src="script/store.js"></script>
  <script src="script/api.js"></script>
  <script src="script/preferences.js"></script>
  <script src="script/i18n.js"></script>
  <script src="script/app.js"></script>
  <script src="script/rooms.js"></script>
</body>
</html>
