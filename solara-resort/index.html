<!doctype html>
<html lang="en" translate="no" data-theme="dark" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solara Luxury Resort & Spa</title>
    <meta name="description" content="Experience world-class luxury, beachfront retreats, fine dining, and seamless reservations at Solara Resort." />
    <meta property="og:title" content="Solara Luxury Resort & Spa" />
    <meta property="og:description" content="Experience world-class luxury, beachfront retreats, fine dining, and seamless reservations at Solara Resort." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1419" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var theme = 'dark';
          var raw = localStorage.getItem('solara_prefs');
          if (raw) {
            var prefs = JSON.parse(raw);
            if (prefs.theme === 'light' || prefs.theme === 'dark') theme = prefs.theme;
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="notranslate bg-bg text-text antialiased min-h-screen selection:bg-gold/30 selection:text-gold-light">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
